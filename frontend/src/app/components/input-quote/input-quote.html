<tui-textfield iconStart="@tui.message-square-quote" [formGroup]="formGroup" >

  <textarea
    formControlName="quoteText"
    class="quote-input"
    placeholder="Digite a citação..."

    tuiTextarea
    [rows]="5"
  ></textarea>
</tui-textfield>
