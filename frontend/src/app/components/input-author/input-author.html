<tui-textfield iconStart="@tui.user-round-pen" [formGroup]="formGroup">
  <label tuiLabel>Cadastrar Autor</label>
  <input tuiComboBox formControlName="authorName"/>
  
  <button
    (click)="next()"
    tuiIconButton
    tuiSlot="right"
    type="submit"
    size="s"
    iconStart="@tui.forward"
    appearance="outline-grayscale"
  >
    Salvar Autor
  </button>

  <tui-data-list-wrapper
        *tuiTextfieldDropdown
        new
        [items]="items | tuiFilterByInput"
    />

</tui-textfield>
