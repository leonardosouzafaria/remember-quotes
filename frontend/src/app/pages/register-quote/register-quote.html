<div class="flex flex-column h-screen px-4">
  <section class="flex flex-grow-1 justify-content-center flex-column">
    <p class="philosophy-quote">
      “Quem retorna ao conhecimento transforma informação em sabedoria.”
    </p>

    @for (option of menuOptions; track option.label) {
      <tui-chip size="s" class="mb-3">{{ option.label }}</tui-chip>
    }
  </section>

  <form [formGroup]="quoteForm" class="pb-4 w-full max-w-xl mx-auto input-wrapper">
    <tui-carousel #carousel>
      <div tuiGroup *tuiItem class="group">
        <app-input-quote [formGroup]="quoteForm" (nextInput)="carousel.next()"></app-input-quote>
      </div>
      <div tuiGroup *tuiItem class="group item">
        <app-input-author [formGroup]="quoteForm" (nextInput)="carousel.next()"></app-input-author>
      </div>
      <div tuiGroup *tuiItem class="group item">
        <app-input-book [formGroup]="quoteForm" (nextInput)="carousel.next()"></app-input-book>
      </div>
    </tui-carousel>
  </form>
</div>
